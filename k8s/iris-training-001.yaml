apiVersion: v1
kind: Namespace
metadata:
  name: ai-infra-lab

---
apiVersion: batch/v1
kind: Job
metadata:
  name: iris-training-001
  namespace: ai-infra-lab

spec:
  backoffLimit: 0   
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: trainer
          image: iris-trainer:local
          imagePullPolicy: Never
          args: ["--c", "1.0"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1G"
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: training-output
              mountPath: /app/artifacts
              readOnly: false
      volumes:
        - name: training-output
          hostPath:
            path: /training-output
            type: Directory